[package]
name = "printer-test-scheduler"
version = "0.2.1"
description = "Scheduled Windows printer test-page printing"
authors = ["Printer Test Scheduler contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "printer-test-scheduler"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
image = "0.25"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
thiserror = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_TaskScheduler",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging"
] }

[[bin]]
name = "printer-test-scheduler-worker"
path = "src/bin/printer-test-scheduler-worker.rs"
